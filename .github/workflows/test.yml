name: Test Suite

on:
  push:
    branches: [indev, main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  message-hub:
    name: MessageHub (Stylus / Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
      - run: cargo test --lib
        working-directory: message-hub

  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: |
            - recursive: true
      - run: pnpm --filter @arbilink/sdk test
        working-directory: packages/sdk

  relayer:
    name: Relayer (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: |
            - recursive: true
      - run: pnpm --filter @arbilink/relayer test
        working-directory: packages/relayer

  receiver:
    name: Receiver (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test
        working-directory: contracts/receiver
